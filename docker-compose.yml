version: '3.8'
networks:
  social-anti-club:
    driver: bridge

services:
  db:
    container_name: postgres
    restart: on-failure
    image: postgres:16.3
    command: ["postgres", "-c", "config_file=/etc/postgresql.conf"]
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=master
      - POSTGRES_DB=social
    volumes:
      - /data/pg/:/var/lib/postgresql/data
      - ./config/pg/postgresql.conf:/etc/postgresql.conf
      - ./config/pg/pg_hba.conf:/etc/pg_hba.conf
    ports:
      - "6532:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U social -d social" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - social-anti-club

  async-bobr:
    container_name: postgres-slave
    restart: on-failure
    image: postgres:16.3
    command: >
      bash 
      -c "
      pg_basebackup -R -X stream --dbname=postgresql://repluser:replsocial@db --pgdata=/var/lib/postgresql/data &&
      docker-entrypoint.sh postgres"
    environment:
      - POSTGRES_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "7632:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U social -d social" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - social-anti-club

#  async-jezik:
    

  app:
    container_name: app
    build:
      context: .
      dockerfile: "./Dockerfile"
    entrypoint: "/app/main"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      async-bobr:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      adminer:
        condition: service_started
      prometheus:
        condition: service_started
    ports:
      - "5000:5000"
      - "8080:8080"
      - "8082:8082"
    networks:
      - social-anti-club

  adminer:
    container_name: adminer
    image: adminer:4.8.1
    restart: on-failure
    ports:
      - "8084:8080"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - social-anti-club

  migrator:
    container_name: migrator
    image: migrate/migrate:v4.17.1
    command: ["-database", "postgres://master:secret@db:5432/social?sslmode=disable", "-source", "file:///migrations", "-verbose", "up" ]
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - social-anti-club

  pg-exp-master:
    container_name: pg-exp-master
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: on-failure
    ports:
      - "65321:9187"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATA_SOURCE_NAME=postgresql://master:secret@db:5432/social?sslmode=disable
    networks:
      - social-anti-club

  pg-exp-async:
    container_name: pg-exp-async
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: on-failure
    ports:
      - "65322:9187"
    depends_on:
      async-bobr:
        condition: service_healthy
    environment:
      - DATA_SOURCE_NAME=postgresql://master:secret@db-slave:5432/social?sslmode=disable
    networks:
      - social-anti-club

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: on-failure
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus:/prometheus
    depends_on:
      pg-exp-master:
        condition: service_started
      pg-exp-async:
        condition: service_started
    ports:
      - "9090:9090"
    networks:
      - social-anti-club

  grafana:
    image: grafana/grafana-enterprise
    restart: unless-stopped
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=secret
      - GF_LOG_LEVEL=error
    user: '0'
    volumes:
      - ./grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - social-anti-club

  etcd:
    image: bitnami/etcd:latest
    container_name: etcd
    restart: on-failure
    environment:
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_ROOT_PASSWORD=qwerty
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - social-anti-club

volumes:
  prometheus: