global:
  scrape_interval:     10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prom'
    static_configs:
    - targets: ['localhost:9090']

  - job_name: 'app'
    scrape_interval: 10s
    static_configs:
    - targets: ['app:8082']

  - job_name: 'postgres-master'
    scrape_interval: 10s
    static_configs:
      - targets: [ 'pg-exp-master:9187' ]

  - job_name: 'postgres-async'
    scrape_interval: 10s
    static_configs:
      - targets: [ 'pg-exp-async:9187' ]